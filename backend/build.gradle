plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.senac.portalinstrutor'
version = '0.0.1-SNAPSHOT'

// O backend serve exclusivamente o bundle mobile (../mobile/dist).
def staticSource = file('../mobile/dist')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Versionamento de schema (ver D1). O baseline reproduz o schema atual das entidades.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    // Banco embarcado usado no perfil "local" (rodar sem PostgreSQL/Docker).
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Empacota o front-end mobile (../mobile/dist) como recursos estáticos da API.
// Falha o build de forma clara se a pasta não existir (evite jar sem interface).
processResources {
    doFirst {
        if (!staticSource.exists()) {
            throw new GradleException("Pasta '../mobile/dist' não encontrada. Rode 'npm ci && npm run build' em mobile/ antes do build do backend.")
        }
    }
    from(staticSource) {
        into 'static'
        exclude '**/package-lock.json'
        exclude '**/node_modules/**'
    }
}
