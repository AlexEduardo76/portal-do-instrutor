# Perfil local: roda sem PostgreSQL e sem Docker, usando H2 em arquivo.
# Ative com --spring.profiles.active=local (o script rodar.ps1 já faz isso).
spring.datasource.url=jdbc:h2:file:./.local/portal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema é criado/atualizado pelo Hibernate; as migrações Flyway são do PostgreSQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.seed.senha=${SEED_SENHA:senac123}
