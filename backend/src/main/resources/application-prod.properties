# Perfil de produção (ative com SPRING_PROFILES_ACTIVE=prod)
# Schema validado pelo Hibernate; alterações só via migrações Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cookie apenas via HTTPS.
server.servlet.session.cookie.secure=true

# Dados fictícios só são criados quando SEED_SENHA é definida explicitamente.
app.seed.senha=${SEED_SENHA:}

# Documentação interativa desabilitada em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
