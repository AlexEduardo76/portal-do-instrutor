server.port=${PORT:8080}

# Conexão com o PostgreSQL do Supabase (via pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Configuração do Supabase
supabase.url=https://woedgspgejcdswmygxtj.supabase.co
supabase.publishable-key=sb_publishable_5yfujObvOCti1EuaB7k4Pg_hS72oy1K

# Configuração do Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Migrações do banco de dados
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Fuso horário e datas
spring.jackson.time-zone=America/Sao_Paulo
app.fuso-horario=America/Sao_Paulo

# Sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Aplicação atrás de proxy (Render etc.)
server.forward-headers-strategy=framework

# Tratamento de erros
server.error.include-message=never
server.error.include-stacktrace=never

# Regras de negócio
app.frequencia-minima=75
app.seed.senha=${SEED_SENHA:}

# Monitoramento
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never