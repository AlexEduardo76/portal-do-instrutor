services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portal
      MYSQL_ROOT_PASSWORD: "123"
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - portal-mysql:/var/lib/mysql

volumes:
  portal-mysql: