<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Senac</title>
    <link rel="icon" type="image/png" href="img/logo-senac.png">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Área Principal de Login -->
    <main class="login-main">
        <div class="login-card">

            <!-- Cabeçalho do Card -->
            <div class="login-brand">
                <img src="img/logo-senac.png" alt="Senac" height="40">
            </div>
            <div class="login-header-text">
                <h2>Bem-vindo(a)</h2>
                <p>Acesse sua conta institucional</p>
            </div>

            <!-- Formulário de Usuário e Senha -->
            <form class="login-form" id="form-login" novalidate>
                <p id="login-erro" class="login-erro" role="alert" hidden></p>

                <div class="input-group">
                    <label for="usuario">Usuário, E-mail ou CPF</label>
                    <input type="text" id="usuario" placeholder="Digite seu usuário ou CPF" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox" id="lembrar"> Lembrar-me
                    </label>
                    <span class="login-hint">Esqueceu a senha? Contate o administrador.</span>
                </div>

                <button type="submit" class="btn-login">Entrar no Portal</button>
            </form>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
